[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextsift"
version = "1.0.0"
description = "Zero-dependency, offline-first CLI output compaction and context slimming engine."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "gitstq" }]
keywords = ["cli", "llm", "token", "offline", "zero-dependency", "log-compaction"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
contextsift = "contextsift.cli:main"

[tool.setuptools.packages.find]
include = ["contextsift*"]

[tool.unittest]
start-dir = "tests"
